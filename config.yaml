# Configuration for the trading support automation pipeline.
# Paths are relative to the project root.

# Directory where overnight batch files are expected to arrive.
input_dir: data/raw/

# Directory where daily summary reports are written.
output_path: data/processed/

# Directory where exception reports are written.
error_path: data/errors/

# File path for the pipeline's log output.
log_path: logs/pipeline.log

# Date to run checks for (YYYYMMDD). Change for replays.
run_date: "20260512"

# Expected cut-off time for overnight file arrival (24-hour HH:MM).
cutoff_time: "08:00"

# File patterns expected each day ({date} is replaced with run_date).
expected_files:
  - trades_{date}.csv
  - positions_{date}.csv
  - pnl_{date}.csv

# Maximum allowed percentage change in total notional before flagging as exception.
notional_tolerance_pct: 10.0

# Per-file schema definitions used by the validation stage.
schemas:
  trades:
    columns: [trade_id, ticker, side, quantity, price, notional, timestamp]
    key_columns: [trade_id, ticker]
    numeric_columns: [quantity, price, notional]
    has_trade_id: true

  positions:
    columns: [ticker, quantity, avg_price, market_value]
    key_columns: [ticker]
    numeric_columns: [quantity, avg_price, market_value]
    has_trade_id: false
    
  pnl:
    columns: [ticker, realized_pnl, unrealized_pnl, total_pnl]
    key_columns: [ticker]
    numeric_columns: [realized_pnl, unrealized_pnl, total_pnl]
    has_trade_id: false